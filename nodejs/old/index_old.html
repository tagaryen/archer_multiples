<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>静态资源服务</title>
  <link rel = "icon" href = "/ico" type = "image/x-icon">
</head>
<body>
<div class="File">
  <div class="file-head">
    <div class="file-title">静态资源</div>
    <div class="file-upload">
      <button class="file-btn" onclick="showFileUpload()">文件上传</button>
      <div id="modal-file-overlay" class="modal-file-overlay">
      <div class="modal-file-content">
        <div class="modal-file-header">
          <div>文件上传</div>
          <button onclick="closeFileUpload()" class="close-btn">✖</button>
        </div>
        <div id='file-upload-dropzone' class="file-upload-dropzone" onclick="triggerFileInput()">
          <div class="file-upload-dropzone-content">
            <svg class="upload-icon" viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
            <div style="font-size: 18px;">拖拽或选择文件</div>
            <input type="file" id="file-input" onchange="onFileChange(event)" class="file-input" multiple>
          </div>
        </div>
        <div class="file-data" id='file-data'>
          <div class="file-info">
            <span class="file-name" id="upload-file-name"></span>
            <span class="file-size" id="upload-file-size"></span>
          </div>
          <button onclick="removeFile()" id='remove-btn' class="remove-btn">&times;</button>
        </div>
        <div id='file-progress-area' style="text-align: center; min-height: 21px; width: calc(100% - 72px);margin: 0px 36px ;">
          <div style="width: calc(100% - 32px); text-align: left; position: relative; line-height: 20px; margin-right: 6px;">
            <div id='file-progress' style="height: 10px; background-color: #409eff; border-radius: 6px; margin-top: 6px;"></div>
          </div>
          <div style="width: 38px; line-height: 20px;" id="upload-percentage"></div>
        </div>
        <div class="modal-file-footer" id = 'modal-file-footer'>
          <button onclick="closeFileUpload()" class="cancel-btn">取消</button>
          <button onclick="uploadFile()" class="upload-btn" id = 'upload-btn'>上传</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class = "file-area">
    <div class="list-title" id="file-title"></div>
    <div class="file-list" id="file-list"></div>
    <div class="file-page" id="file-page">
      <button class = "file-page-btn" id="file-page-btn-1" onclick="prevPage()" onmouseover="pageMouseover(1)" onmouseout="pageMouseout()">上一页</button>
      <span id="page-desc"></span>
      <button class = "file-page-btn" id="file-page-btn-2" onclick="nextPage()" onmouseover="pageMouseover(2)" onmouseout="pageMouseout()">下一页</button>
    </div>
  </div>  
  <div class="remove-password-card" id="remove-password-card">
    <div class="remove-password-body">
      <div class="remove-password-input">
        <div class="remove-password-wrapper">
          <input type="password" id="password-input" placeholder="请输入密码" autocomplete="off">
        </div>
        <div class="remove-password-error" id="remove-password-error"></div>
      </div>
      <div class="remove-password-actions">
        <button class="remove-password-cancel" id="cancelModalBtn" onclick="deleteFileCancel()">取消</button>
        <button class="remove-password-confirm" id="confirmPasswordBtn" onclick="confirmDeleteFile()">确认</button>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
const global = {
    fileUploadShow: false,
    file: null,
    percentage: 0,
    uploadText: '上传',
    total: 0,
    pageNum: 1,
    pages: 0,
    deleteFile: null
}
function truncateByCanvas(str, maxWidth, fontSize = 14, fontFamily = 'Arial') {
  let ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `${fontSize}px ${fontFamily}`;
  let result = '';
  for (let ch of str) {
    let test = result + ch;
    if (ctx.measureText(test).width > maxWidth) {
      return result + '...';
    }
    result = test;
  }
  return result;
}
function drawToolTips(el, content, side) {
  let elId = `archer-tooltip-${side}`
  const rect = el.getBoundingClientRect();
  let afterCssRule = `#${elId}::after {content: ''; position: absolute; top: 50%; right: 100%; transform: translateY(-50%); border: 9px solid transparent; border-right-color: #e2e8f0; pointer-events: none; }`
  let left = rect.right + 16;
  let top = rect.top + rect.height / 2 - 12;
  let tooltip = document.getElementById(elId);
  if(tooltip) {
    tooltip.innerHTML = content;
    tooltip.style.display = 'inline-block';
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    return;
  }
  if(afterCssRule) {
    tooltip = document.createElement('div');
    tooltip.id = elId;
    tooltip.innerHTML = content;
    tooltip.style.display = 'inline-block';
    tooltip.style.position = 'absolute';
    tooltip.style.zIndex = '1000';
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.style.display = 'inline-block';
    tooltip.style.padding = '4px 6px';
    tooltip.style.fontSize = '14px';
    tooltip.style.lineHeight = '1.5';
    tooltip.style.borderRadius = '8px';
    tooltip.style.backgroundColor = '#e2e8f0';
    tooltip.style.boxShadow = '0 8px 28px rgba(0, 0, 0, 0.18)';
    tooltip.style.textAlign = 'center';
    tooltip.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
    const sheet = document.styleSheets[0];
    for(let rule of sheet.cssRules) {
      if (rule.selectorText === `#${elId}::after`) {
        return ;
      }
    }
    sheet.insertRule(afterCssRule, sheet.cssRules.length);
    document.body.appendChild(tooltip);
  }
}
function removeToolTips(side) {
  let elId = `archer-tooltip-${side}`
  let tooltip = document.getElementById(elId);
  if(tooltip) {
    tooltip.style.display = 'none';
    return;
  }
}
function fileuploadDropAreaInit() {
    let dropArea = document.getElementById('file-upload-dropzone');  
    dropArea.style.display = 'block';

    let fileInput = document.getElementById('file-input');  
  
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {  
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();  
            e.stopPropagation();  
        }, false);  
    });  
  
    // 高亮效果  
    ['dragenter', 'dragover'].forEach(eventName => {  
      dropArea.addEventListener(eventName, () => {dropArea.classList.add('drag-over')}, false);  
    });  
  
    ['dragleave', 'drop'].forEach(eventName => {  
      dropArea.addEventListener(eventName, () => {dropArea.classList.remove('drag-over')}, false);  
    });  
  
    dropArea.addEventListener('drop', (e) => {  
        let dt = e.dataTransfer;  
        let files = dt.files;  
        if (files.length === 0) return;  
        addFile(files[0]);  
    }, false);

    let fileData = document.getElementById('file-data');  
    fileData.style.display = 'none';
    
    let removeBtn = document.getElementById('remove-btn');  
    removeBtn.disabled = false;
    
    let fileProgressArea = document.getElementById('file-progress-area');  
    fileProgressArea.style.display = 'none';
    
    let fileProgress = document.getElementById('file-progress');  
    fileProgress.style.width = '0%';

    let uploadPercentage = document.getElementById('upload-percentage');  
    uploadPercentage.innerHTML = "0%"

    
    let fileFooter = document.getElementById('modal-file-footer');  
    fileFooter.style.display = 'none';
}
function showFileUpload() {
    fileuploadDropAreaInit();

    let fileUpload = document.getElementById('modal-file-overlay');
    fileUpload.style.display = 'flex';
}
function closeFileUpload() {
    let fileUpload = document.getElementById('modal-file-overlay');
    fileUpload.style.display = 'none';
}
function addFile(file) {
    if(!file) {
        console.log("未添加文件");
        return;
    }
    global.file = file;
    
    let fileFooter = document.getElementById('modal-file-footer');  
    fileFooter.style.display = 'flex';
    
    let dropArea = document.getElementById('file-upload-dropzone');  
    dropArea.style.display = 'none';

    let fileData = document.getElementById('file-data');  
    fileData.style.display = 'flex';
    
    let uploadFileName = document.getElementById('upload-file-name');  
    let uploadFileSize = document.getElementById('upload-file-size');      
    uploadFileName.innerHTML = global.file?global.file.name:"" ; 
    uploadFileSize.innerHTML = formatFileSize(global.file?global.file.size:0);

    let uploadBtn = document.getElementById('upload-btn');  
    uploadBtn.innerHTML = "上传"
    uploadBtn.disabled = false;

}

function removeFile() {
    global.file = null;
    fileuploadDropAreaInit();
}

function onFileChange(e) {
    addFile(e.target.files[0])
}

function triggerFileInput() {
    let fileInput = document.getElementById('file-input');
    fileInput.click();  
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes'
    const k = 1024
    const sizes = ['Bytes', 'KB', 'MB', 'GB']
    const i = Math.floor(Math.log(bytes) / Math.log(k))
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i]
}

function refreshFileList(pageNum) {
    let data = {total: 0, pageNum: 1, files: []};
    try {
        let xhr = new XMLHttpRequest();  
        xhr.open('GET', '/list?pageNum='+pageNum, false);  
        xhr.send(null); 
        if(xhr.status === 200) {
            let res = JSON.parse(xhr.responseText);
            if(res.success && res.data) {
                data = res.data;
            }
        }
    } catch(err) {
        console.log(err);
    }
    
    let fileTitle = document.getElementById('file-title');  
    let fileTitleHtml = '<label class="filename title-content" style="padding-left: 10px;">名称</label>' +
        '<label class="fileurl title-content">在线预览</label>' +
        '<label class="filetime title-content">时间</label>' +
        '<label class="fileaction title-content">操作</label>';
    fileTitle.innerHTML = fileTitleHtml;

    let fileList = document.getElementById('file-list');  
    let html = "", i = 0, fUrl = '', fName = '';
    for(let f of data.files) {
        fUrl = "/"+f.url;
        fUrl = fUrl.length > 28 ? fUrl.substr(0, 28) + "..." : fUrl
        fName = truncateByCanvas(f.name, 190, 18);
        html += '<div class="list-content">';
        html += '<label class="filename item-content name-content"><div class="filename-item" onclick="downloadFileByName(\''+f.name+'\')" onmouseover="drawToolTips(this, \'点击下载\', \'left\')" onmouseout="removeToolTips(\'left\')">'+fName+'</div></label>';
        html += '<label class="fileurl item-content" >';
        html += '<a href=/'+f.url+' target="_blank">'+fUrl+ '</a>';
        html += '</label >';
        html += '<label class="filetime item-content time-content">'+f.time+'</label>';
        html += '<label class="filedelete item-content" onclick="deleteFileByName(\''+f.name+'\')">删除</label>';
        html += '</div>';
    }
    fileList.innerHTML = html;

    global.pageNum = data.pageNum;
    global.total = data.total;
    global.pages = Math.ceil(data.total / 10)
    
    let filePage = document.getElementById('file-page'); 
    if(global.pages <= 1) {
      filePage.style.display = 'none';
    } else {
      filePage.style.display = 'flex';
    }

    let pageBtn1 = document.getElementById('file-page-btn-1'); 
    let pageBtn2 = document.getElementById('file-page-btn-2');
    if(global.pageNum <= 1) {
        pageBtn1.disabled = true;
    } else {
        pageBtn1.disabled = false;
    }
    if(global.pageNum >= global.pages) {
        pageBtn2.disabled = true;
    } else {
        pageBtn2.disabled = false;
    }
    
    let pageDesc = document.getElementById('page-desc');
    pageDesc.style.lineHeight = '32px';
    pageDesc.innerHTML = `第 ${global.pageNum} 页，共 ${global.pages} 页`
}

function uploadFile() {  
    global.percentage = 0;

    if(!global.file) {
        console.log("未选择文件");
        return ;
    }

    let uploadBtn = document.getElementById('upload-btn');  
    uploadBtn.innerHTML = "上传中"
    uploadBtn.disabled = true;

    let formData = new FormData();  
    formData.append('file', global.file);  

    let fileData = document.getElementById('file-data');  
    fileData.style.display = 'flex';

    let removeBtn = document.getElementById('remove-btn');  
    removeBtn.disabled = true;

    let fileProgressArea = document.getElementById('file-progress-area');  
    fileProgressArea.style.display = 'flex';

    let uploadPercentage = document.getElementById('upload-percentage');  
    let fileProgress = document.getElementById('file-progress');  

    let xhr = new XMLHttpRequest();  
    // 监听上传进度  
    xhr.upload.addEventListener('progress', function(event) { 
        if (event.lengthComputable) {  
            let percentComplete = Math.ceil((event.loaded / event.total) * 100);  
            fileProgress.style.width = percentComplete + '%';
            uploadPercentage.innerHTML = percentComplete===0?"":(percentComplete+"%")
        }  
    }, false);  
    
    xhr.addEventListener('load', function() { 
        fileProgress.style.width = '100%';
        let uploadArea = document.getElementById('modal-file-overlay')
        uploadArea.style.display = 'none';

        refreshFileList(global.pageNum);
    });  
    
    xhr.addEventListener('error', function() { 
        let uploadArea = document.getElementById('modal-file-overlay')
        uploadArea.style.display = 'none';
    }); 
    xhr.open('POST', '/upload', true);
    xhr.send(formData); 
}  

function downloadFileByName(name) {
  window.open('/download?filename='+name);
}

function deleteFileByName(name) {
    let removePwd = document.getElementById('remove-password-card');
    removePwd.style.display = 'block';
    global.deleteFile = name;
    let error = document.getElementById('remove-password-error');
    error.innerHTML = ""
}

function deleteFileCancel() {
    let removePwd = document.getElementById('remove-password-card');
    removePwd.style.display = 'none';
    global.deleteFile = null;
}

function confirmDeleteFile() {
    let error = document.getElementById('remove-password-error');
    if(!global.deleteFile) {
      error.innerHTML = "未选中任何文件"
      return ;
    }
    let input = document.getElementById('password-input');
    if(!input.value || input.value === '') {
      error.innerHTML = "请输入密码"
      return ;
    }
    let xhr = new XMLHttpRequest();
    xhr.open('POST', '/remove', false);
    xhr.setRequestHeader("content-type", "application/json");
    xhr.send(JSON.stringify({name:global.deleteFile, password: input.value})); 
    
    if(xhr.status === 200) {
        let res = JSON.parse(xhr.responseText);
        if(res.success) {
            let removePwd = document.getElementById('remove-password-card');
            removePwd.style.display = 'none';
            global.deleteFile = null;
            input.value = ""
            global.total = global.total - 1;
            global.pages = Math.ceil(global.total / 10);
            if(global.pageNum > global.pages) {
                global.pageNum = global.pages;
            }
            refreshFileList(global.pageNum);
            return ;
        }
    }
    error.innerHTML = "删除失败"
}


function pageMouseover(type) {
    let pageBtn1 = document.getElementById('file-page-btn-1'); 
    let pageBtn2 = document.getElementById('file-page-btn-2'); 
    if(type === 1 && global.pageNum > 1) {
        pageBtn1.classList.add('button-hover');
    }
    if(type === 2 && global.pageNum < global.pages) {
        pageBtn2.classList.add('button-hover');
    }
}
function pageMouseout() {
    let pageBtn1 = document.getElementById('file-page-btn-1'); 
    let pageBtn2 = document.getElementById('file-page-btn-2'); 
    pageBtn1.classList.remove('button-hover');
    pageBtn1.classList.remove('button-hover');
}

function prevPage() {
    if (global.pageNum > 1) {
        refreshFileList(global.pageNum-1);
    }
}
function nextPage() {
    if (global.pageNum < global.pages) {
        refreshFileList(global.pageNum+1);
    }
}

window.global = global;
window.onload = (e) => {
    refreshFileList(1);
};
</script>
