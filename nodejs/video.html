<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>$(title_template)</title>
<link rel = "icon" href = "$(icon_template)" type = "image/x-icon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, "Segoe UI", sans-serif;
    padding: 20px;
  }
  .player {
    width: 100%;
    max-width: 800px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .video-wrap {
    position: relative;
    background: #000;
    cursor: pointer;
  }
  video {
    width: 100%;
    display: block;
  }
  .play-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }
  .play-overlay::after {
    content: "";
    border-style: solid;
    border-width: 12px 0 12px 22px;
    border-color: transparent transparent transparent #764ba2;
    margin-left: 5px;
  }
  .play-overlay.hidden { opacity: 0; pointer-events: none; }
  .controls {
    padding: 15px 20px;
    color: #fff;
  }
  .progress {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 12px;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 3px;
    width: 0%;
    position: relative;
  }
  .progress-bar::after {
    content: "";
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .bottom {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 18px;
    padding: 5px;
    opacity: 0.9;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 1; }
  .time {
    font-size: 13px;
    opacity: 0.8;
    font-variant-numeric: tabular-nums;
  }
  .volume {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .volume input {
    width: 80px;
    accent-color: #764ba2;
  }
  .title {
    padding: 0 20px 15px;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="player">
  <div class="title">$(video_name)</div>
  <div class="video-wrap" id="videoWrap">
    <video id="video">
      <source src="$(video_src)" type="$(video_type)">
      您的浏览器不支持视频播放。
    </video>
    <div class="play-overlay" id="overlay"></div>
  </div>
  <div class="controls">
    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="bottom">
      <button class="btn" id="playBtn">▶</button>
      <span class="time"><span id="current">0:00</span> / <span id="duration">0:00</span></span>
      <div class="volume">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
      </div>
    </div>
  </div>
</div>
<script>
  const video = document.getElementById('video');
  const playBtn = document.getElementById('playBtn');
  const overlay = document.getElementById('overlay');
  const videoWrap = document.getElementById('videoWrap');
  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');
  const current = document.getElementById('current');
  const duration = document.getElementById('duration');
  const volume = document.getElementById('volume');
  function formatTime(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  videoWrap.addEventListener('click', () => {
    if (video.paused) video.play();
    else video.pause();
  });
  video.addEventListener('play', () => {
    playBtn.textContent = '⏸';
    overlay.classList.add('hidden');
  });
  video.addEventListener('pause', () => {
    playBtn.textContent = '▶';
    overlay.classList.remove('hidden');
  });
  video.addEventListener('timeupdate', () => {
    const percent = (video.currentTime / video.duration) * 100;
    progressBar.style.width = percent + '%';
    current.textContent = formatTime(video.currentTime);
  });
  video.addEventListener('loadedmetadata', () => {
    duration.textContent = formatTime(video.duration);
  });
  progress.addEventListener('click', (e) => {
    const rect = progress.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    video.currentTime = percent * video.duration;
  });
  volume.addEventListener('input', () => {
    video.volume = volume.value;
  });
</script>
</body>
</html>
