<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%;">
<head>
  <meta charset="utf-8">
  <title>文件存取</title>
</head>
<body style="background-color: white; height: 100vh; margin: 0px;">
<style>
  .file-item:hover {
    background-color: #e7e5e5;
  }
  ::-webkit-scrollbar {
    width: 0px;
  }
</style>
<div style="height: 30px;font-size: 24px; display: flex; justify-content: space-between; border-bottom: 1px solid #ababab; padding: 16px 0px; text-align: center;background-color: #e7e5e5;">
    <div style="margin: 0px 40px;">文件数据</div>
    <div id="add-file" style="margin: 0px 40px; color: #3787e8; cursor:pointer;">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
    </div>
</div>
<div id="file-list" style="height: calc(100% - 50px); padding: 5px 30px; overflow-x: hidden; overflow-y: scroll;"></div>
<div id="deletePanel" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%, -50%); background-color: white;max-width: 90%; border-radius: 54px; box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);padding: 4px 16px; transition: box-shadow 0.25s ease;z-index: 899;">
    <input id="pwdInput" type="text" style="margin: 4px 40px;margin-top: 30px; width: 454px; padding:10px 20px; flex: 1;border: 2px solid #3787e8;border-radius: 36px; background: transparent;font-size: 16px;outline: none;" placeholder="请输入密码"/>
    <div id="pwdErrorMsg" style="font-size: 12px; color: #db4b4b;margin: 0px 40px; margin-bottom: 10px; padding: 0px 20px; width: 460px; height:10px"></div>
    <div style="margin: 30px 40px; width: 500px; display: flex;justify-content: space-between;">
    <div id="confirmDelete" style="margin-right: 30px;padding: 10px 0px; width: 50%; font-size: 16px; border-radius: 36px; background-color: #db4b4b; color: white;text-align: center;">确认</div>
    <div onclick="hideDeletePanel()" style="margin-left: 30xp;padding: 10px 0px; width: 50%; font-size: 16px; border-radius: 36px; background-color: #3787e8; color: white;text-align: center;">取消</div>
    </div>
</div>
<script>
const ctx = document.createElement('canvas').getContext('2d');
function truncateByCanvas(str, maxWidth, fontSize = 14, fontFamily = 'Arial') {
  ctx.font = `${fontSize}px ${fontFamily}`;
  let result = '';
  for (let ch of str) {
    let test = result + ch;
    if (ctx.measureText(test).width > maxWidth) {
      return result + '...';
    }
    result = test;
  }
  return result;
}
function drawToolTips(content, options) {
  if(!content) {
    content = "提示";
  }
  if(!options) {
    options = {};
  }
  let elId = `archer-tooltip-bottom`
  let  left = options.left || 0, top = options.top || 0;
  let backgroundColor = options.backgroundColor || '#e2e8f0';
  let afterCssRule = `#${elId}::after {content: ''; position: absolute; bottom: 100%;left: 50%;transform: translateX(-50%) rotateX(180deg);border: 9px solid transparent;border-top-color: ${backgroundColor};pointer-events: none; }`

  let tooltip = document.getElementById(elId);
  if(tooltip) {
    tooltip.innerHTML = content;
    tooltip.style.display = 'inline-block';
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    return;
  }
  if(afterCssRule) {
    tooltip = document.createElement('div');
    tooltip.id = elId;
    tooltip.innerHTML = content;
    tooltip.style.display = 'inline-block';
    tooltip.style.position = 'absolute';
    tooltip.style.zIndex = '1000';
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.style.display = 'inline-block';
    tooltip.style.padding = '4px 6px';
    tooltip.style.fontSize = '14px';
    tooltip.style.lineHeight = '1.5';
    tooltip.style.borderRadius = '8px';
    tooltip.style.backgroundColor = backgroundColor;
    tooltip.style.boxShadow = '0 8px 28px rgba(0, 0, 0, 0.18)';
    tooltip.style.textAlign = 'center';
    tooltip.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
    let sheet = null;
    if(document.styleSheets.length > 0) {
      sheet = document.styleSheets[0];
    } else {
      let style = document.createElement('style');
      document.head.appendChild(style);
      sheet = document.styleSheets[0];
    }
    for(let rule of sheet.cssRules) {
      if (rule.selectorText === `#${elId}::after`) {
        return ;
      }
    }
    sheet.insertRule(afterCssRule, sheet.cssRules.length);
    document.body.appendChild(tooltip);
  }
}
function removeToolTips() {
  let elId = `archer-tooltip-bottom`
  let tooltip = document.getElementById(elId);
  if(tooltip) {
    tooltip.style.display = 'none';
  }
}
function initElements() {
    document.getElementById('archerProgressBar').style.display = "none";
    document.getElementById('archerProgress').style.width = '0%';
    document.getElementById('archerProgressText').textContent = '0%';
    document.getElementById('archerFileItem').style.display = "none";
    document.getElementById('archerDropZone').style.display = "block";
    document.getElementById("archerUploadContainer").style.display = "none";
    let clearBtn = document.getElementById('archerClearBtn');
    clearBtn.disabled = false;
    clearBtn.style.opacity = "1";
    let uploadBtn = document.getElementById('archerUploadBtn');
    uploadBtn.disabled = true;
    uploadBtn.style.opacity = "0.5";
}
function createHeader(container) {
    const header = document.createElement('div');
    header.innerHTML = '<span style="font-size: 24px; line-height: 1; width: calc(100% - 30px)">📤 上传文件</span>';
    header.style.display = "flex";
    header.style.alignItems = "center";
    header.style.gap = "12px";
    header.style.marginBottom = "28px";
    const closeBtn = document.createElement('div');
    closeBtn.innerHTML = "✖";
    closeBtn.style.color = "#000";
    closeBtn.style.width = "30px";
    closeBtn.style.fontSize = "24px";
    closeBtn.style.cursor = "pointer";
    closeBtn.style.textAlign = "right";
    closeBtn.onclick = () => {
        initElements();
    };
    closeBtn.onmouseover = () => {
        closeBtn.style.color = "#f74215";
    }
    closeBtn.onmouseout = () => {
        closeBtn.style.color = "#000";
    }
    header.appendChild(closeBtn);
    container.appendChild(header);
}
function createDropZone(container, options, uploadCallback) {
    const dropZone = document.createElement('div');
    dropZone.id = "archerDropZone";
    dropZone.innerHTML = `
        <span style="font-size: 52px; display: block; margin-bottom: 16px; line-height: 1;">📁</span>
        <div style="font-size: 18px; font-weight: 500; color: #0b1a33; margin-bottom: 6px;">拖拽或选择文件</div>
        <input type="file" id="archerFileInput" multiple style="display: none;" />
        `;
    dropZone.style.border = "2px dashed #d7e0eb";
    dropZone.style.borderRadius = "20px";
    dropZone.style.padding = "52px 24px 48px";
    dropZone.style.textAlign = "center";
    dropZone.style.background = "#fafcff";
    dropZone.style.transition = "background 0.2s, border-color 0.2s";
    dropZone.style.cursor = "pointer";
    dropZone.style.position = "relative";
    function addFile(file) {
        dropZone.style.display = "none";
        let k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
        let i = Math.floor(Math.log(file.size) / Math.log(k));
        document.getElementById('archerFileName').textContent = file.name;
        document.getElementById('archerFileSize').textContent = parseFloat((file.size / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        let fileItem = document.getElementById('archerFileItem');
        fileItem.style.display = "block";
        
        let uploadBtn = document.getElementById('archerUploadBtn');
        let clearBtn = document.getElementById('archerClearBtn');
        clearBtn.onclick = () => {
            fileItem.style.display = "none";
            uploadBtn.disabled = true;
            uploadBtn.style.opacity = "0.5";
            dropZone.style.display = "block";
        };
        uploadBtn.disabled = false;
        uploadBtn.style.opacity = "1";
        uploadBtn.onclick = () => {
            if(uploadCallback) {
                uploadCallback(file);
            }
            if(options?.showProgressBar) {
                document.getElementById('archerProgressBar').style.display = "block";
            }
            clearBtn.disabled = true;
            clearBtn.style.opacity = "0.5";
            uploadBtn.disabled = true;
            uploadBtn.style.opacity = "0.5";
        };
    }
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();  
        e.stopPropagation();
        dropZone.style.borderColor = "#4a6cf7";
        dropZone.style.background = "#f0f4ff";
    });
    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();  
        e.stopPropagation();
        dropZone.style.borderColor = "#d7e0eb";
        dropZone.style.background = "#fafcff";
    });
    ['dragenter', 'drop'].forEach(eventName => {  
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();  
            e.stopPropagation();  
        });  
    }); 
    dropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length === 0) return;  
        addFile(e.dataTransfer.files[0]);  
    });
    dropZone.addEventListener('mouseover', (e) => {   
        e.preventDefault();
        dropZone.style.borderColor = "#a0b8d4";
        dropZone.style.background = "#f5f9ff";
    });
    dropZone.addEventListener('mouseout', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "#d7e0eb";
        dropZone.style.background = "#fafcff";
    });
    dropZone.onclick = () => {
        const fileInput = document.getElementById('archerFileInput');
        fileInput.onchange = (e) => {
            if (e.target.files.length === 0) return;
            addFile(e.target.files[0]);
        };
        fileInput.click();
    };
    container.appendChild(dropZone);
}
function createFileItem(container) {
    const fileItem = document.createElement('div');
    fileItem.id = "archerFileItem";   
    fileItem.style.display = "none";
    fileItem.style.alignItems = "center";
    fileItem.style.justifyContent = "space-between";
    fileItem.style.padding = "12px 16px";
    fileItem.style.marginTop = "16px";
    fileItem.style.background = "#fff";
    fileItem.style.fontSize = "14px";
    fileItem.style.color = "#0b1a33";

    fileItem.innerHTML = `
        <div style="display: flex;">
        <div id="archerFileName" style="width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></div>
        <div id="archerFileSize" style="width: 35%; text-align: right;"></div>
        </div>
    `;

    let progressBar = document.createElement('div');
    progressBar.id = "archerProgressBar";
    progressBar.style.display = "none";
    progressBar.style.width = "100%";
    progressBar.style.height = "20px";
    progressBar.style.marginTop = "8px";
    progressBar.innerHTML = `<div style="width: 100%; height: 6px; background: #eef3fe; border-radius: 3px; border: 1px solid #ccd4f5;">
                                <div id="archerProgress" style="width: 0%; height: 100%; background: #4a6cf7; border-radius: 3px;"></div>
                            </div>
                            <div id="archerProgressText" style="text-align: center; font-size: 12px; color: #666; margin-top: 2px;">0%</div>`;
    fileItem.appendChild(progressBar);

    container.appendChild(fileItem);
}
function createActions(container) {
    const actions = document.createElement('div');
    actions.style.marginTop = "24px";
    actions.style.display = "flex";
    actions.style.justifyContent = "flex-end";
    actions.style.gap = "12px";
    actions.style.flexWrap = "wrap";
    
    let clearBtn = document.createElement('button');
    clearBtn.id = "archerClearBtn";
    clearBtn.type = "button";
    clearBtn.innerHTML = "🗑 清空";

    let uploadBtn = document.createElement('button');
    uploadBtn.id = "archerUploadBtn";
    uploadBtn.type = "button";
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = "⬆ 上传";
    
    clearBtn.style.display = uploadBtn.style.display = "inline-flex";
    clearBtn.style.alignItems = uploadBtn.style.alignItems = "center";
    clearBtn.style.gap = uploadBtn.style.gap = "8px";
    clearBtn.style.padding = uploadBtn.style.padding = "10px 26px";
    clearBtn.style.borderRadius = uploadBtn.style.borderRadius = "18px";
    clearBtn.style.fontSize = uploadBtn.style.fontSize = "15px";
    clearBtn.style.fontWeight = uploadBtn.style.fontWeight = "500";
    clearBtn.style.border = uploadBtn.style.border = "none";
    clearBtn.style.color = uploadBtn.style.color = "#1f3a6b";
    clearBtn.style.transition = uploadBtn.style.transition = "background 0.15s, transform 0.1s";
    clearBtn.style.lineHeight = uploadBtn.style.lineHeight = "1.4";

    clearBtn.style.background = "#eef3fe";
    clearBtn.style.cursor = "pointer";
    uploadBtn.style.cursor = "not-allowed";
    uploadBtn.style.background = "#4a6cf7";
    uploadBtn.style.opacity = "0.5";
    uploadBtn.style.color = "#fff";

    clearBtn.addEventListener('mouseover', () => {
        clearBtn.style.background = "#e1eafe";
        clearBtn.style.borderColor = "#b0c4dd";
        if(!clearBtn.disabled) {
            clearBtn.style.cursor = "pointer";
            clearBtn.style.opacity = "0.9";
        } else {
            clearBtn.style.cursor = "not-allowed";
            clearBtn.style.opacity = "0.6";
        }
    });
    clearBtn.addEventListener('mouseout', () => {
        clearBtn.style.background = "#eef3fe";
        clearBtn.style.borderColor = "transparent";
        if(!clearBtn.disabled) {
            clearBtn.style.cursor = "pointer";
            clearBtn.style.opacity = "1";
        } else {
            clearBtn.style.cursor = "not-allowed";
            clearBtn.style.opacity = "0.5";
        }
    });
    uploadBtn.addEventListener('mouseover', () => {
        uploadBtn.style.borderColor = "#3a5de0";
        if(!uploadBtn.disabled) {
            uploadBtn.style.cursor = "pointer";
            uploadBtn.style.opacity = "0.9";
        } else {
            uploadBtn.style.cursor = "not-allowed";
            uploadBtn.style.opacity = "0.6";
        }
    });
    uploadBtn.addEventListener('mouseout', () => {
        uploadBtn.style.borderColor = "transparent";
        if(!uploadBtn.disabled) {
            uploadBtn.style.cursor = "pointer";
            uploadBtn.style.opacity = "1";
        } else {
            uploadBtn.style.cursor = "not-allowed";
            uploadBtn.style.opacity = "0.5";
        }
    });
    actions.appendChild(clearBtn);
    actions.appendChild(uploadBtn);
    container.appendChild(actions);
}
function drawUploadWindow(options, uploadCallback) {
    let container = document.getElementById("archerUploadContainer");
    if (container) {
        container.style.display = "block";
        return;
    }
    container = document.createElement('div');
    container.id = "archerUploadContainer";
    container.style.width = '100%';
    container.style.maxWidth = '600px';
    container.style.background = '#ffffff';
    container.style.borderRadius = '18px';
    container.style.boxShadow = '0 20px 60px rgba(0, 20, 40, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04)';
    container.style.padding = '20px 36px 40px';
    container.style.transition = 'box-shadow 0.25s ease';
    container.style.zIndex = options?.zIndex || '999';
    if(options?.left !== undefined && options?.top !== undefined) {
        container.style.position = 'absolute';
        container.style.left = options.left + 'px';
        container.style.top = options.top + 'px';
    } else {
        container.style.position = 'fixed';
        container.style.left = '50%';
        container.style.top = '50%';
        container.style.transform = 'translate(-50%, -50%)';
    }
    createHeader(container);
    createDropZone(container, {showProgressBar: options?.showProgressBar}, uploadCallback);
    createFileItem(container);
    createActions(container);
    document.body.appendChild(container);
}
function updateProgress(percent) {
    let progress = document.getElementById('archerProgress');
    let progressText = document.getElementById('archerProgressText');
    progress.style.width = percent + '%';
    progressText.textContent = percent + '%';
}
function finishAndCloseUploadWindow(options, finishCallback) {
    let progress = document.getElementById('archerProgress');
    let progressText = document.getElementById('archerProgressText');
    if(!options) {
        options = {};
    }
    if(options.success) {
        progress.style.width = '100%';
        progressText.textContent = '完成';
        setTimeout(() => {
            initElements();
            if (finishCallback) {
                finishCallback();
            }
        }, 600);
    } else {
        progressText.textContent = options.content || "失败"
    }
}
function uploadFile(file) { 
    let formData = new FormData();  
    formData.append('file', file); 
    let xhr = new XMLHttpRequest(); 
    xhr.upload.addEventListener('progress', function(event) { 
        if (event.lengthComputable) {  
            let percentComplete = Math.ceil((event.loaded / event.total) * 100);
            updateProgress(percentComplete);
        }  
    });  
    xhr.addEventListener('load', function() { 
        finishAndCloseUploadWindow({success: true}, null);
        refreshFileList();
    });  
    xhr.addEventListener('error', function() { 
        finishAndCloseUploadWindow({success: false}, null);
    }); 
    xhr.open('POST', '/upload', true);
    xhr.send(formData); 
}  
function downloadFileByName(name) {
    window.open('/download?filename='+name);
}
function showFileByUrl(url) {
    window.open(url);
}
function showDeletePanel(name) {
    let deleteEl = document.getElementById('deletePanel');
    deleteEl.style.display = "block";
    document.getElementById('confirmDelete').onclick = () => {
        let input = document.getElementById('pwdInput');
        let error = document.getElementById('pwdErrorMsg');
        if(!input.value || input.value === '') {
            error.innerHTML = "请输入密码"
            return ;
        }
        let xhr = new XMLHttpRequest();
        xhr.open('POST', '/remove', false);
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send(JSON.stringify({name, password: input.value})); 
        if(xhr.status === 200) {
            let res = JSON.parse(xhr.responseText);
            if(res.success) {
                deleteEl.display = 'none';
                input.value = ""
                refreshFileList();
                return ;
            }
        }
        error.innerHTML = "密码错误"
    }
}
function hideDeletePanel() {
    document.getElementById('deletePanel').style.display = "none";
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdErrorMsg').innerHTML = '';
}
function fileNameHoverIn(e, i) {
    let left = e.clientX - 28;
    let top = document.getElementById(`file-name-${i}`).getBoundingClientRect().bottom + 8;
    drawToolTips("点击预览", {top, left});
}
function fileNameHoverOut() {
    removeToolTips();
}
function refreshFileList() {
    let data = {total: 0, pageNum: 1, files: []};
    try {
        let xhr = new XMLHttpRequest();  
        xhr.open('GET', '/list?pageNum=1', false);  
        xhr.send(null); 
        if(xhr.status === 200) {
            let res = JSON.parse(xhr.responseText);
            if(res.success && res.data) {
                data = res.data;
            }
        }
    } catch(err) {
        console.log(err);
    }
    let fileList = document.getElementById('file-list');  
    let html = "", i = 0, fUrl = '', fName = '';
    for(let f of data.files) {
        fName = truncateByCanvas(f.name, 800, 20);
        html += `
        <div class="file-item" style="display: flex; padding: 10px 30px;">
            <div id="file-name-${i}" style="width: calc(100% - 310px);"><div style="cursor:pointer; max-width:100%;width:fit-content;font-size: 20px; font-weight: 400; font-family:Arial, Helvetica, sans-serif; color: #3787e8;" onclick="showFileByUrl('/${f.url}')" onmouseover="fileNameHoverIn(event, ${i})" onmouseout="fileNameHoverOut()">${fName}</div></div>
            <div style="width: 250px;font-size: 16px;color: darkgrey; display: flex; align-items: flex-end;padding-bottom: 4px;text-align: center;">${f.time}</div>
            <div style="display: flex;justify-content: space-between; width: 50px">
                <div style="width: 24px;color: #3787e8; cursor:pointer" onclick="downloadFileByName('${f.name}')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                </div>
                <div style="width: 24px;color: #3787e8; cursor:pointer" onclick="showDeletePanel('${f.name}')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                </div>
            </div>
        </div>`;
        i++;
    }
    fileList.innerHTML = html;
}
window.onload = function() {
    refreshFileList();
    let addFileEl = document.getElementById('add-file');
    addFileEl.onclick = () => {
        drawUploadWindow({showProgressBar: true}, (file) => {
            uploadFile(file);
        });
    };
    addFileEl.onmouseover = (e) => {
        let rect = addFileEl.getBoundingClientRect();
        let left = rect.right - 40, top = rect.bottom + 16;
        drawToolTips("新增",{left, top});
    }
    addFileEl.onmouseout = () => {
        removeToolTips();
    }
};
</script>
</body>
</html>
