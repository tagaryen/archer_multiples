<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Tool展示</title>
</head>
<body>
<div id="tips" style="position: absolute; top: 60px; left: 200px; width: 120px; height: 50px; font-size: 14px; color: #edebeb; background-color: #557df5; border-radius: 4px; text-align: center; line-height: 20px; cursor: pointer;" data-tooltip="鼠标移至此处显示提示信息">
    鼠标移至此处显示提示信息,点击上传
</div>
<script type="module">
import { drawToolTips, removeToolTips } from './tooltips.js';
import { drawUploadWindow, updateProgress, finishAndCloseUploadWindow } from './uploadWindow.js';
window.onload = function() {
    document.getElementById('tips').addEventListener('mouseover', function() {
        drawToolTips("底部提示", {side:'bottom', left: 220, top: 120, backgroundColor: '#adadad'});
        drawToolTips("顶部提示", {side:'top', left: 220, top: 20, backgroundColor: '#adadad'});
        drawToolTips("左侧提示", {side:'left', left: 120, top: 70, backgroundColor: '#adadad'});
        drawToolTips("右侧提示", {side:'right', left: 330, top: 70, backgroundColor: '#adadad'});
    });
    document.getElementById('tips').addEventListener('mouseout', function() {
        removeToolTips('bottom');
        removeToolTips('top');
        removeToolTips('left');
        removeToolTips('right');
    });
    document.getElementById('tips').onclick = function() {
        drawUploadWindow({showProgressBar: true}, (file) => {
            console.log("上传文件:", file);
            // 在这里处理上传逻辑，例如发送到服务器
            
            setTimeout(() => {
                updateProgress(30); // 模拟上传进度
                setTimeout(() => {
                    updateProgress(60); // 模拟上传进度
                    setTimeout(() => {
                        updateProgress(100); // 模拟上传完成
                        // finishAndCloseUploadWindow(() => {
                        //     console.log("上传完成，关闭窗口");
                        // }); // 完成上传
                    }, 1000);
                }, 1000);
            }, 1000);
        });
    };
};

</script>

</body>
</html>
